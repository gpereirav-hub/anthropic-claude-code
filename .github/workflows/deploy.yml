name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages. Pages only deploys from
# the repository's default branch, so this runs on pushes to the default branch
# (currently the parlay-analyzer branch) and main, and can be triggered manually.
# `configure-pages` with enablement auto-turns Pages on the first run.
on:
  push:
    branches:
      - main
      - claude/parlay-analyzer-tool-jgdved
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
